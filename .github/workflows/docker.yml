# Docker 이미지: main·PR에서는 빌드와 스모크 테스트만 하고, v* 태그에서는 GHCR에 게시한다.
# 외부 액션은 태그가 바뀌어도 영향받지 않도록 커밋 SHA로 고정한다(주석은 해당 버전).
name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: 이미지 빌드
        run: docker build -t localqpu:ci .
      - name: 컨테이너 실행과 HEALTHCHECK 확인
        run: |
          docker run -d --rm -p 127.0.0.1:8787:8787 --name localqpu-ci localqpu:ci
          for attempt in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' localqpu-ci)
            [ "$health" = "healthy" ] && break
            sleep 1
          done
          echo "health=$health"
          [ "$health" = "healthy" ]
          test "$(docker exec localqpu-ci id -u)" = "10001"
      - name: 실제 Qiskit 클라이언트로 스모크 테스트
        run: |
          uv sync --python 3.12
          LOCALQPU_EXTERNAL_PORT=8787 uv run --no-sync pytest -q tests/contract/test_container_smoke.py
      - name: 컨테이너 로그
        if: always()
        run: docker logs localqpu-ci || true
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
