# v* 태그를 푸시하면 검사 → 빌드 → PyPI 게시를 한다.
# PyPI Trusted Publishing(OIDC)을 쓰므로 API 토큰을 저장소에 두지 않는다.
# 외부 액션은 태그가 바뀌어도 영향받지 않도록 커밋 SHA로 고정한다(주석은 해당 버전).
# PyPI 쪽 pending publisher 설정: owner=ictechgy, repository=localqpu, workflow=release.yml, environment=pypi
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: 태그와 pyproject 버전이 같은지 확인
        run: |
          version=$(uv run --no-project --python 3.12 python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "태그(${GITHUB_REF_NAME})와 pyproject 버전(v${version})이 다릅니다. pyproject.toml의 version을 맞춘 뒤 다시 태그하세요."
            exit 1
          fi
      - name: 의존성 설치
        run: uv sync --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
      - name: 배포물 빌드
        run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI pending publisher의 environment 이름과 같아야 한다.
    environment:
      name: pypi
      url: https://pypi.org/project/localqpu/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
